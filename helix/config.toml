theme = "base16_transparent"

[editor]
mouse = true
line-number = "absolute"
cursorline = true
bufferline = "multiple"
auto-completion = true
auto-info = true
end-of-line-diagnostics = "hint"

[editor.cursor-shape]
normal = "underline"
insert = "bar"
select = "block"

[keys.normal]
# Duplicate through the yank register and restore the original cursor position.
"S-A-up" = ["save_selection", "extend_to_line_bounds", "yank", "paste_before", "jump_backward"]
"S-A-down" = ["save_selection", "extend_to_line_bounds", "yank", "paste_after", "jump_backward"]
# Helix has no native line-swap command; this swaps a line through its register.
"A-up" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"A-down" = ["extend_to_line_bounds", "delete_selection", "paste_after"]

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
